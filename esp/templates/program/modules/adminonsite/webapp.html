<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/media/default_styles/webapp.css" />
    <link rel="stylesheet" type="text/css" href="/media/default_styles/adminonsite.css" />
    <title>
        {% block title %}Admin Dashboard — {{ program.niceName }}{% endblock %}
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% block head %}{% endblock %}
</head>
<body>

<div class="navbar">
  <table>
    <tr>
      <td{% if webapp_page == "dashboard" %} class="selected"{% endif %}>
        <a class="no-dec" href="/onsite/{{ one }}/{{ two }}/adminonsite" style="display:block;">
          <i class="material-icons md-5">dashboard</i><br>Dashboard
        </a>
      </td>
      <td{% if webapp_page == "classes" %} class="selected"{% endif %}>
        <a class="no-dec" href="/onsite/{{ one }}/{{ two }}/adminonsite_classes" style="display:block;">
          <i class="material-icons md-5">class</i><br>Classes
        </a>
      </td>
      <td{% if webapp_page == "settings" %} class="selected"{% endif %}>
        <a class="no-dec" href="/onsite/{{ one }}/{{ two }}/adminonsite_settings" style="display:block;">
          <i class="material-icons md-5">settings</i><br>Settings
        </a>
      </td>
    </tr>
  </table>
</div>

{% block body %}{% endblock %}

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>
